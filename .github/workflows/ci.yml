name: CI

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  test:
    name: RabbitMQ ${{ matrix.rabbitmq }}, ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    # jruby-head is informational: it must not fail the build
    continue-on-error: ${{ matrix.ruby == 'jruby-head' }}

    env:
      CI: true

    services:
      rabbitmq:
        image: rabbitmq:${{ matrix.rabbitmq }}-management
        ports:
          - 5672:5672
          - 15672:15672
        options: --name rabbitmq

    strategy:
      fail-fast: false
      matrix:
        ruby:
          - jruby-10.1
          - jruby-9.4
          - jruby-head
        rabbitmq:
          - "4.3"
          - "4.2"

    steps:
      - uses: actions/checkout@v4

      # Pin the JVM instead of inheriting whatever the runner image ships:
      # a runner JDK older than the one JRuby was built with fails to load it
      - name: Set up the JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Wait for RabbitMQ to start
        run: until sudo lsof -i:5672; do echo "Waiting for RabbitMQ to start..."; sleep 1; done

      - name: Set up RabbitMQ
        run: ./bin/ci/before_build_docker.sh

      - name: Run tests
        run: bundle exec rspec spec

  test_all:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: Test (matrix)
    needs: [test]
    steps:
      - name: Check test matrix status
        if: ${{ needs.test.result != 'success' }}
        run: exit 1
